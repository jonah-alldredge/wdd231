<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Knect | Early Access Sign Up</title>
  <meta name="description"
    content="Sign up for early access to Knect and tell us what you like to do with friends. We will email you when the app is ready.">
  <meta name="author" content="Jonah Alldredge">
  <meta property="og:title" content="Join Knect | Early Access Sign Up">
  <meta property="og:description"
    content="Sign up for early access to Knect and tell us what you like to do with friends. We will email you when the app is ready.">
  <meta property="og:image" content="https://jonah-alldredge.github.io/wdd231/final/images/knect-og.webp">
  <meta property="og:url" content="https://jonah-alldredge.github.io/wdd231/final/join.html">
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/large.css">
  <script type="module" src="scripts/signup.js"></script>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="home.html">Knect</a>
    <div class="header-controls">
      <button class="icon-btn theme-toggle" type="button">
        <span class="visually-hidden">Switch between light and dark mode</span>
        <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
      <button class="icon-btn menu-toggle" type="button">
        <span class="visually-hidden">Menu</span>
        <svg class="icon-menu" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
    <nav class="site-nav">
      <a href="home.html">Home</a>
      <a  href="join.html" class="current">Join</a>
      <a href="activities.html">Activities</a>
    </nav>
  </header>

  <main>
    <div>
      <div class="page-intro">
        <h1 class="page-title">Join Knect</h1>
        <p>Sign up for early access and tell us what you like to do with friends.</p>
      </div>
      <section class="card">
        <form id="join-form" class="form" action="thankyou.html" method="get">
          <div class="name-row">
            <label class="field"><span>First name</span><input type="text" name="firstName" autocomplete="given-name"
                required></label>
            <label class="field"><span>Last name</span><input type="text" name="lastName" autocomplete="family-name"
                required></label>
          </div>
          <label class="field"><span>Phone</span><input type="tel" name="phone" autocomplete="tel" required
              pattern="[0-9 +\(\)\-]{7,20}" title="Use 7 to 20 digits, spaces, or the symbols ( ) + -"></label>
          <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
          <fieldset class="likes">
            <legend>What do you like to do with friends?</legend>
            <div class="checks">
              <label class="check"><input type="checkbox" name="likes" value="Food">Food</label>
              <label class="check"><input type="checkbox" name="likes" value="Movies">Movies</label>
              <label class="check"><input type="checkbox" name="likes" value="Sports">Sports</label>
              <label class="check"><input type="checkbox" name="likes" value="Outdoors">Outdoors</label>
              <label class="check"><input type="checkbox" name="likes" value="Games">Games</label>
              <label class="check"><input type="checkbox" name="likes" value="Music">Music</label>
            </div>
          </fieldset>
          <button class="btn" type="submit">Sign up</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Jonah Alldredge. Knect is a WDD231 project.</p>
    <nav class="footer-links">
      <a href="attributions.html">Attributions</a>
      <a href="https://www.youtube.com/watch?v=REPLACE_ME">Video demo</a>
    </nav>
  </footer>
</body>

</html>
